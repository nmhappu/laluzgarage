name: Build and Publish Android Release (OTA)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release track / channel'
        required: true
        type: choice
        options:
          - 'stable'
          - 'dev'
        default: 'stable'
      version_tag:
        description: 'Tag / version name (e.g. v0.3.0 or v0.3.0-dev.1)'
        required: false
      release_notes:
        description: 'Release notes / changelog'
        required: false
        default: 'Automated OTA update build.'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web Dist
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew executable
        run: chmod +x ./android/gradlew

      - name: Determine Release Channel & Metadata
        id: meta
        run: |
          # If manual dispatch, use user input; otherwise deduce from tag
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ github.event.inputs.channel }}"
            TAG_NAME="${{ github.event.inputs.version_tag }}"
            if [ -z "$TAG_NAME" ]; then
              TAG_NAME="v$(date +'%Y.%m.%d')-${CHANNEL}"
            fi
            NOTES="${{ github.event.inputs.release_notes }}"
          else
            TAG_NAME="${{ github.ref_name }}"
            if echo "$TAG_NAME" | grep -qiE "-(dev|alpha|beta|canary|rc)"; then
              CHANNEL="dev"
            else
              CHANNEL="stable"
            fi
            NOTES="OTA release for ${TAG_NAME} (${CHANNEL} track)."
          fi

          IS_PRERELEASE="false"
          if [ "$CHANNEL" = "dev" ]; then
            IS_PRERELEASE="true"
          fi

          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT
          echo "notes=${NOTES}" >> $GITHUB_OUTPUT

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug
          cd ..

      - name: Prepare Release APK Asset
        id: prepare_asset
        run: |
          CHANNEL="${{ steps.meta.outputs.channel }}"
          TAG_NAME="${{ steps.meta.outputs.tag_name }}"
          
          SOURCE_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          TARGET_APK="laluzgarage-${CHANNEL}-${TAG_NAME}.apk"
          
          if [ -f "$SOURCE_APK" ]; then
            cp "$SOURCE_APK" "$TARGET_APK"
            echo "apk_path=${TARGET_APK}" >> $GITHUB_OUTPUT
            echo "apk_name=${TARGET_APK}" >> $GITHUB_OUTPUT
          else
            echo "Error: APK not found at $SOURCE_APK"
            exit 1
          fi

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: LaluZ Garage ${{ steps.meta.outputs.tag_name }} (${{ steps.meta.outputs.channel }})
          body: |
            ### LaluZ Garage ${{ steps.meta.outputs.tag_name }}
            
            **Release Channel:** `${{ steps.meta.outputs.channel }}`
            
            #### What's Changed
            ${{ steps.meta.outputs.notes }}
            
            ---
            *Built automatically via GitHub Actions OTA Pipeline.*
          draft: false
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          files: |
            ${{ steps.prepare_asset.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
