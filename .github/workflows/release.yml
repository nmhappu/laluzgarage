name: Build and Publish Android Release (OTA)

on:
  push:
    # Stable: 2.0.0. Dev: 2.1.0-dev (or 2.1.0-dev.2). A leading "v" is also accepted.
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-dev*'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-dev*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag: 2.0.0 for stable, 2.1.0-dev (or 2.1.0-dev.2) for dev'
        required: true
      release_notes:
        description: 'Release notes / changelog'
        required: false
        default: 'Automated OTA update build.'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew executable
        run: chmod +x ./compose-app/gradlew

      - name: Determine Release Channel & Metadata
        id: meta
        run: |
          # The tag decides the channel: plain MAJOR.MINOR.PATCH is stable, a -dev suffix is dev.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.version_tag }}"
            NOTES="${{ github.event.inputs.release_notes }}"
          else
            TAG_NAME="${{ github.ref_name }}"
            NOTES=""
          fi

          if echo "$TAG_NAME" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            CHANNEL="stable"
          elif echo "$TAG_NAME" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+-dev(\.[0-9]+)?$'; then
            CHANNEL="dev"
          else
            echo "::error::Tag '$TAG_NAME' must look like 2.0.0 (stable) or 2.1.0-dev / 2.1.0-dev.2 (dev)."
            exit 1
          fi
          if [ -z "$NOTES" ]; then
            NOTES="OTA release for ${TAG_NAME} (${CHANNEL} track)."
          fi

          IS_PRERELEASE="false"
          if [ "$CHANNEL" = "dev" ]; then
            IS_PRERELEASE="true"
          fi

          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT
          echo "notes=${NOTES}" >> $GITHUB_OUTPUT

      - name: Restore secrets (google-services.json, keystore)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > compose-app/app/google-services.json
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        working-directory: compose-app
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          VERSION_NAME="$(echo "${{ steps.meta.outputs.tag_name }}" | sed -E 's/^[vV]//')"
          # versionCode is derived from the version in build.gradle.kts, so it follows the tag order.
          # gradle.properties pins a Windows JDK path; override it for the runner.
          ./gradlew :app:assembleRelease             -Dorg.gradle.java.home="$JAVA_HOME"             -PappVersionName="$VERSION_NAME"

      - name: Prepare Release APK Asset
        id: prepare_asset
        run: |
          CHANNEL="${{ steps.meta.outputs.channel }}"
          TAG_NAME="${{ steps.meta.outputs.tag_name }}"

          SOURCE_APK="compose-app/app/build/outputs/apk/release/app-release.apk"
          TARGET_APK="laluzgarage-${CHANNEL}-${TAG_NAME}.apk"

          if [ -f "$SOURCE_APK" ]; then
            cp "$SOURCE_APK" "$TARGET_APK"
            echo "apk_path=${TARGET_APK}" >> $GITHUB_OUTPUT
          else
            echo "Error: signed APK not found at $SOURCE_APK (is the keystore secret set?)"
            exit 1
          fi

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: LaluZ Garage ${{ steps.meta.outputs.tag_name }}
          body: |
            ### LaluZ Garage ${{ steps.meta.outputs.tag_name }}
            
            **Release Channel:** `${{ steps.meta.outputs.channel }}`
            
            #### What's Changed
            ${{ steps.meta.outputs.notes }}
            
            ---
            *Built automatically via GitHub Actions OTA Pipeline.*
          draft: false
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          # Publish to the public releases repo; the source repo stays private.
          repository: nmhappu/laluzgarage-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          files: |
            ${{ steps.prepare_asset.outputs.apk_path }}
