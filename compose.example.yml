# ==============================================================================
# LaluZ Garage - Docker Compose Configuration
# ==============================================================================
# Quick Start:
#   1. Copy this file:
#        cp compose.example.yml compose.yml
#   2. Fill in your Firebase credentials in compose.yml or in a .env file.
#   3. Start the container:
#        docker compose up -d
#   4. Access LaluZ Garage at:
#        http://localhost:2266
# ==============================================================================

services:
  laluz-garage:
    # Option A: Pull pre-built production package from GitHub Container Registry
    image: ghcr.io/nmhappu/laluzgarage:latest

    # Option B: Build locally from source repository (uncomment to build locally)
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    container_name: laluzgarage
    restart: unless-stopped

    # Host port mapping -> Container port (default: 2266)
    ports:
      - "${PORT:-2266}:2266"

    # Optional: Load environment variables directly from a .env file
    # env_file:
    #   - .env

    # Flexible environment variables passed to the container at runtime.
    # You can specify either VITE_FIREBASE_* or FIREBASE_* format.
    environment:
      - PORT=2266
      - SERVER_NAME=localhost

      # Firebase Client SDK Configuration (Required for cloud synchronization)
      - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY:-}
      - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN:-}
      - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID:-}
      - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET:-}
      - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
      - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID:-}
      - VITE_FIREBASE_FIRESTORE_DATABASE_ID=${VITE_FIREBASE_FIRESTORE_DATABASE_ID:-ai-studio-68b1ba2c-7611-4e4f-b6eb-ac12f212fa4e}

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2266/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
