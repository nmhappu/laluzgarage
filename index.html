<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#07080A" />
    <title>LaluZ Garage</title>
    <link rel="icon" type="image/svg+xml" href="/lz_lightning.svg" />
    <script>
      // Apply the saved theme before the first paint, so the splash never flashes the wrong surface.
      (function () {
        var mode = 'system';
        try {
          mode = localStorage.getItem('theme_mode') || localStorage.getItem('theme') || 'system';
        } catch (e) {}
        var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#07080A' : '#F1F5F9');
      })();
    </script>
    <style>
      /* Pre-boot splash only; the app's tokens take over once the stylesheet loads. */
      html, body { margin: 0; height: 100%; background: #07080A; }
      html[data-theme='light'], html[data-theme='light'] body { background: #F1F5F9; }
      .lz-splash { height: 100vh; height: 100dvh; display: flex; align-items: center; justify-content: center; }
      .lz-ink { fill: #FFFFFF; }
      html[data-theme='light'] .lz-ink { fill: #0F172A; }
    </style>
  </head>
